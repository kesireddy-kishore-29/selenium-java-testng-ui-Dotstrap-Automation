# GitHub Actions. Any key can be overridden by an environment variable (sauce.baseUrl -> SAUCE_BASE_URL).
sauce.baseUrl=https://www.saucedemo.com
# Public demo credentials, printed on Sauce Demo's own login page.
sauce.username=standard_user
sauce.password=secret_sauce
# The UI flagship's self-hosted app (sibling folder: npm run sut). Tests that need it skip when it is down.
app.baseUrl=http://localhost:4173
live.baseUrl=https://dotstrap.com
browser.headless=true
browser.width=1366
browser.height=900
wait.timeoutSeconds=10
wait.pageLoadSeconds=30
record.mode=failures
video.mode=stitch
video.frameRate=2
